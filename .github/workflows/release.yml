name: Release

on:
  push:
    branches: [main]

# reset permissions; grant only what the release job needs
permissions: {}

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write # commit version changes, push tags
      pull-requests: write # open the "Version Packages" PR
      id-token: write # npm trusted publishing (OIDC)
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # npm trusted publishing needs Node >= 22.14 and npm >= 11.5.1
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build Schema
        run: bun buildSchema

      - name: Type check
        run: bun run type-check

      - name: Test
        run: bun test

      - name: Lint
        run: bun run lint

      - name: Create Release Pull Request or Publish to npm
        id: changesets
        uses: changesets/action@v2.1.2
        with:
          pr-title: "Version Packages"
          commit-message: "chore: version packages"
          publish-script: bun run release
          create-github-releases: true
